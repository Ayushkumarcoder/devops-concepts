name: CI Pipeline
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: action/checkout@v5

      - name: Set up Node.js
        uses: action/setup-node@v3
        with:
          node-version: 16

      - name: Install dep
        run: npm install

      - name: Run test
        run: npm test